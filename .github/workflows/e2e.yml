name: E2E

# Playwright end-to-end suite against the full docker compose stack
# (api, worker, web, caddy, mailpit). Stripe is the FAKE (empty
# STRIPE_SECRET_KEY): checkouts get a local success URL and
# `python -m dbcore.cli seed-completed <cs_id>` plays the completed event,
# so receipts (with claim codes) land in Mailpit without a Stripe account.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:8086
      E2E_MAILPIT_URL: http://localhost:8026
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for the local stack
        run: |
          cp .env.example .env
          set_var() { sed -i "s|^$1=.*|$1=$2|" .env; grep -q "^$1=" .env || echo "$1=$2" >> .env; }
          set_var PAYMENTS_URL http://localhost:8086
          set_var ACCOUNTS_URL http://localhost:8085
          set_var ACCOUNTS_INTERNAL_URL http://localhost:8085
          set_var VITE_API_URL http://localhost:8086/api
          set_var VITE_APP_URL http://localhost:8086
          set_var VITE_ACCOUNTS_URL http://localhost:8085
          set_var STRIPE_SECRET_KEY ""
          set_var FEATURE_FLAG_OVERRIDES "donations=on,subscriptions=on"
          set_var STRIPE_WEBHOOK_SECRET ""
          set_var POSTHOG_API_KEY ""
          set_var POSTHOG_PERSONAL_API_KEY ""
          set_var VITE_POSTHOG_KEY ""
          set_var SECRET_KEY e2e-ci-secret-not-for-production
          set_var MAIL_ENABLED true
          set_var SMTP_URL smtp://mailpit:1025
          set_var RATE_LIMITS_ENABLED false
          grep -v -i 'secret\|key=' .env

      - name: Start the stack
        run: docker network create edge && docker compose --env-file .env -f deploy/docker-compose.yml up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8086/api/healthz | grep -q '"ok"'; then
              echo "API healthy after ${i} tries"; exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy in 5 minutes"
          docker compose --env-file .env -f deploy/docker-compose.yml ps
          exit 1

      - name: Smoke
        run: BASE_URL=http://localhost:8086 sh deploy/smoke.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: e2e
        run: bun run test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --tail 200
